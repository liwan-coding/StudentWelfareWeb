<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="رعاية الطالب" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C1418" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="صندوق رعاية الطالب الجامعي — تبرّع لدعم الطلبة الجامعيين | Student Welfare Fund — support university students in need." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="صندوق رعاية الطالب الجامعي | Student Welfare Fund" />
    <meta name="twitter:card" content="summary" />
    <title>صندوق رعاية الطالب الجامعي | Student Welfare Fund</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        var locale = localStorage.getItem('locale') || localStorage.getItem('i18nextLng') || 'ar';
        var dir = locale.startsWith('ar') ? 'rtl' : 'ltr';
        var el = document.documentElement;
        el.setAttribute('dir', dir);
        el.setAttribute('lang', locale.startsWith('ar') ? 'ar' : 'en');
        el.classList.remove('dir-ltr', 'dir-rtl');
        el.classList.add(dir === 'rtl' ? 'dir-rtl' : 'dir-ltr');
        // Theme follows the system unless the header toggle stored a choice (applied before first paint)
        var theme = null;
        try { theme = localStorage.getItem('swf_theme'); } catch (e) {}
        if (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        if (theme === 'dark') el.setAttribute('data-theme', 'dark');
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
