<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#A0207E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>صندوق رعاية الطالب الجامعي | Student Welfare Fund</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        var locale = localStorage.getItem('locale') || localStorage.getItem('i18nextLng') || 'ar';
        var dir = locale.startsWith('ar') ? 'rtl' : 'ltr';
        var el = document.documentElement;
        el.setAttribute('dir', dir);
        el.setAttribute('lang', locale.startsWith('ar') ? 'ar' : 'en');
        el.classList.remove('dir-ltr', 'dir-rtl');
        el.classList.add(dir === 'rtl' ? 'dir-rtl' : 'dir-ltr');
        // Dark / light theme chosen from the header toggle (applied before first paint)
        try {
          if (localStorage.getItem('swf_theme') === 'dark') el.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
